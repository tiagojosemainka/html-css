<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags</title>
    <link rel="icon" href="/imagens/favicon.ico" type="image/x-icon">
    <style>
        p {
            font-size: 16px;
            font-family: Arial;
        }

        ul {
            font-size: 16px;
            font-family: Arial;
        }
    </style>
</head>

<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag
        deverá utilizar em cada caso.</p>
    <ul>
        <li title="Use a tag &lt;p&gt;">Páragrafos</li>
        <li title="Use a tag &lt;h1&gt; a &lt;h6&gt;">Títulos</li>
        <li title="Use a tag &lt;img&gt;">Imagens</li>
        <li title="Use a tag &lt;abbr&gt;">Abreviações</li>
        <li title="Use a tag &lt;code&gt;">Códigos fonte</li>
        <li title="Use a tag &lt;ol&gt; e &lt;li&gt;">Listas númeradas</li>
        <li title="Use a tag &lt;ul&gt; e &lt;li&gt;">Listas com demarcadores</li>
    </ul>
</body>

</html>
