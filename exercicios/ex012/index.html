<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo com HTML5</title>
</head>

<body>
    <h1>Inserindo vídeos hospedado localmente</h1>
    <p>Este vídeo esta hospedado no meu próprio servidor.</p>

    <video width="200" controls>
        <source src="/midia/folhas.mp4" type="video/mp4">
        <source src="/midia/folhasb.mp4" type="video/mp4">
        <source src="/midia/folhasw.webm" type="video/webm">
        <p>Seu navegador não tem compatibilidade de reprodução de vídeos.</p>
    </video>

    <h1>Inserindo vídeos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/OzUnqQk4eOg?si=7oXt9g-PQGr3lfNC"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h1>Inserido vídeos do Vimeo</h1>
    <div style="padding:56.25% 0 0 0;position:relative;"><iframe
            src="https://player.vimeo.com/video/330207644?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
            frameborder="0"
            allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            style="position:absolute;top:0;left:0;width:100%;height:100%;" title="Animation reel_2018"></iframe></div>
    <script src="https://player.vimeo.com/api/player.js"></script>
</body>

</html>
