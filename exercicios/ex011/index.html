<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídia em HTML5</title>
</head>

<body>
    <h1>Imagem dinámica</h1>
    <p>
        Tenter abrir este site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu
        navegador.
    </p>

    <picture>
        <source media="(max-width: 750px)" srcset="/imagens/p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="/imagens/m.png" type="image/png">
        <img src="/imagens/g.png" alt="Imagem flexível">
    </picture>

    <h1>Reprodindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <audio src="/midia/bluee.mp3" controls></audio>
    <!-- MP3 WAV OGG-->
    <audio preload="metadata" controls loop>
        <source src="/midia/bluee.mp3" type="audio/mpeg">
        <source src="/midia/bluee.ogg" type="audio/ogg">
        <source src="/midia/bluee.wav" type="audio/wav">
    </audio>
    <!-- Outro código para reprodutor -->
    <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="/midia/bluee.mp3">Clique aqui para baixar o
            arquivo MP3</a></p>
</body>

</html>
