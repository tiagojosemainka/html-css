<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * {
            /* Configurações globais da CSS */
            height: 100%;
        }

        body {
            background-image: linear-gradient(to top, #F25C78, #BF3B91, #7C39BF, #F2B441, #F27F3D);
            background-attachment: fixed;
        }
    </style>
</head>

<body>
    <h1>Testando gradiente</h1>
</body>

</html>
